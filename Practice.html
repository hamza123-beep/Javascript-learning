Here is Challenge #1 - *Dropdown Menu with Keyboard* in one attractive file:
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3. Popup Modal</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
  }
  .card{
    background:white;
    width:90%;
    max-width:400px;
    padding:30px;
    border-radius:16px;
    box-shadow:0 20px 40px rgba(0,0,0,0.2);
    text-align:center;
  }
  h2{color:#333;margin-bottom:10px}
  p{color:#777;margin-bottom:20px;font-size:14px}
  #openModal{
    padding:12px 25px;
    background:#667eea;
    color:white;
    border:none;
    border-radius:10px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
  }
  /* Modal Background */
  #modal{
    display:none;
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    background:rgba(0,0,0,0.6);
    backdrop-filter:blur(4px);
    justify-content:center;
    align-items:center;
    animation:fadeIn 0.3s ease;
  }
  #modal.show{display:flex}
  #modal-content{
    background:white;
    width:90%;
    max-width:380px;
    padding:30px;
    border-radius:16px;
    text-align:center;
    position:relative;
    animation:popUp 0.3s ease;
  }
  #closeModal{
    position:absolute;
    top:10px;right:15px;
    background:none;
    border:none;
    font-size:24px;
    cursor:pointer;
    color:#999;
  }
  #modal-content h3{margin-bottom:10px;color:#333}
  #modal-content p{color:#666;font-size:14px;margin-bottom:20px}
  .ok-btn{
    padding:10px 20px;
    background:#667eea;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
  }
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes popUp{from{transform:scale(0.8);opacity:0}to{transform:scale(1);opacity:1}}
</style>
</head>
<body>

<div class="card">
  <h2>Popup Challenge</h2>
  <p>Click below button to open popup made with plain JS</p>
  <button id="openModal">Open Popup</button>
</div>

<!-- Modal -->
<div id="modal">
  <div id="modal-content">
    <button id="closeModal">&times;</button>
    <h3>🎉 I am a Popup!</h3>
    <p>This popup is made with only HTML, CSS & plain JavaScript. No library used.</p>
    <button class="ok-btn" id="okBtn">Okay Got it</button>
  </div>
</div>

<script>
  let modal = document.getElementById("modal");
  let openBtn = document.getElementById("openModal");
  let closeBtn = document.getElementById("closeModal");
  let okBtn = document.getElementById("okBtn");

  // Open
  openBtn.addEventListener("click", () => {
    modal.classList.add("show");
  });

  // Close with X button
  closeBtn.addEventListener("click", () => {
    modal.classList.remove("show");
  });

  // Close with OK button
  okBtn.addEventListener("click", () => {
    modal.classList.remove("show");
  });

  // Close if click outside the box
  window.addEventListener("click", (e) => {
    if (e.target === modal) {
      modal.classList.remove("show");
    }
  });

  // Close with Escape key
  window.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      modal.classList.remove("show");
    }
  });
</script>

</body>
</html>
